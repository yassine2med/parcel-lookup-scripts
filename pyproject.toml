[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "parcel-lookup-scripts"
version = "0.1.0"
description = "Look up parcels in a local CSV extract of public parcel data"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
parcel-lookup-scripts = "parcel_lookup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
